<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鼎炬 · 综合管理系统</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1d21; color: #e8eaed; font-size: 15px; line-height: 1.5;
}
/* ===== 登录页 ===== */
#loginPage {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(160deg, #1a1d21 0%, #252a30 50%, #1a1d21 100%);
  z-index: 100; padding: 20px;
}
.login-logo {
  width: 80px; height: 80px; border-radius: 16px;
  background: linear-gradient(135deg, #c8102e, #8b0000);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px; box-shadow: 0 8px 32px rgba(200,16,46,0.3);
}
.login-logo svg { width: 44px; height: 44px; }
.login-company { font-size: 14px; color: #9aa0a6; margin-bottom: 4px; letter-spacing: 2px; }
.login-title { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.login-subtitle { font-size: 14px; color: #6b7280; margin-bottom: 36px; }
.login-form { width: 100%; max-width: 340px; }
.login-input-group { margin-bottom: 16px; }
.login-input {
  width: 100%; height: 50px; background: #22262b; border: 1.5px solid #3a4049;
  border-radius: 10px; padding: 0 16px; font-size: 15px; color: #e8eaed;
  outline: none; transition: border-color 0.2s; font-family: inherit;
}
.login-input:focus { border-color: #f59e0b; }
.login-input::placeholder { color: #6b7280; }
.login-btn {
  width: 100%; height: 50px; background: linear-gradient(135deg, #c8102e, #a00d24);
  border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: inherit; margin-top: 8px;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:hover { background: linear-gradient(135deg, #d41533, #b01028); }
.login-error {
  color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center;
  min-height: 18px;
}
.login-hint {
  margin-top: 24px; font-size: 12px; color: #6b7280; text-align: center;
}
.login-footer {
  position: absolute; bottom: 24px; font-size: 12px; color: #4a525e;
  text-align: center; width: 100%;
}
/* ===== 模式选择页 ===== */
#modePage {
  position: fixed; inset: 0; display: none; flex-direction: column;
  background: linear-gradient(160deg, #1a1d21 0%, #252a30 50%, #1a1d21 100%);
  z-index: 90; padding: 20px; overflow-y: auto;
}
#modePage.show { display: flex; }
.mode-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px; padding-top: 12px;
}
.mode-header-left { display: flex; align-items: center; gap: 12px; }
.mode-header-logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, #c8102e, #8b0000);
  display: flex; align-items: center; justify-content: center;
}
.mode-header-logo svg { width: 22px; height: 22px; }
.mode-header-title { font-size: 18px; font-weight: 700; }
.mode-header-sub { font-size: 12px; color: #6b7280; }
.mode-logout {
  background: transparent; border: 1px solid #3a4049; color: #9aa0a6;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.mode-logout:active { background: #2a2f36; }
.mode-welcome {
  text-align: center; margin-bottom: 36px;
}
.mode-welcome h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.mode-welcome p { font-size: 14px; color: #9aa0a6; }
.mode-cards {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
  max-width: 700px; width: 100%; margin: 0 auto;
}
.mode-card {
  background: #2a2f36; border: 1.5px solid #3a4049; border-radius: 16px;
  padding: 32px 24px; cursor: pointer; transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.mode-card:hover { border-color: #f59e0b; transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }
.mode-card:active { transform: translateY(-2px); }
.mode-card-icon {
  width: 64px; height: 64px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.mode-card-icon svg { width: 32px; height: 32px; }
.mode-card-icon.ledger { background: rgba(245,158,11,0.15); color: #f59e0b; }
.mode-card-icon.hr { background: rgba(59,130,246,0.15); color: #3b82f6; }
.mode-card-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.mode-card-desc { font-size: 13px; color: #9aa0a6; line-height: 1.6; }
.mode-card-badge {
  margin-top: 14px; font-size: 11px; padding: 4px 10px; border-radius: 20px;
  background: rgba(245,158,11,0.15); color: #f59e0b;
}
.mode-card-badge.hr { background: rgba(59,130,246,0.15); color: #3b82f6; }
/* ===== 子系统容器 ===== */
#appContainer {
  position: fixed; inset: 0; display: none; flex-direction: column;
  background: #fff; z-index: 80;
}
#appContainer.show { display: flex; }
.app-topbar {
  height: 48px; background: #1a2b4a; display: flex; align-items: center;
  padding: 0 12px; gap: 10px; flex-shrink: 0;
}
.app-back-btn {
  display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1);
  border: none; color: #fff; padding: 8px 14px; border-radius: 8px;
  font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500;
  transition: background 0.2s;
}
.app-back-btn:active { background: rgba(255,255,255,0.2); }
.app-back-btn svg { width: 16px; height: 16px; }
.app-title { color: #fff; font-size: 15px; font-weight: 600; flex: 1; }
.app-iframe {
  flex: 1; width: 100%; border: none; background: #fff;
}
/* ===== 响应式 ===== */
@media (max-width: 600px) {
  .mode-cards { grid-template-columns: 1fr; gap: 16px; }
  .mode-card { padding: 24px 20px; }
  .mode-card-icon { width: 56px; height: 56px; }
  .mode-card-icon svg { width: 28px; height: 28px; }
  .mode-welcome h2 { font-size: 20px; }
  .login-title { font-size: 24px; }
}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>
      <path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/><path d="M9 18v.01"/>
    </svg>
  </div>
  <div class="login-company">温州鼎炬金属科技有限公司</div>
  <div class="login-title">鼎炬综合管理</div>
  <div class="login-subtitle">账单 · 人事 · 一体化管理平台</div>
  <div class="login-form">
    <div class="login-input-group">
      <input type="text" class="login-input" id="loginAccount" placeholder="请输入账号" autocomplete="username">
    </div>
    <div class="login-input-group">
      <input type="password" class="login-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-error" id="loginError"></div>
  </div>
  <div class="login-hint">默认账号：admin / zhangsan / lisi</div>
  <div class="login-footer">DINGJU APP v4.0 | 鼎炬金属科技</div>
</div>

<!-- 模式选择页 -->
<div id="modePage">
  <div class="mode-header">
    <div class="mode-header-left">
      <div class="mode-header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>
        </svg>
      </div>
      <div>
        <div class="mode-header-title">鼎炬综合管理</div>
        <div class="mode-header-sub" id="currentUserDisplay">管理员</div>
      </div>
    </div>
    <button class="mode-logout" onclick="doLogout()">退出登录</button>
  </div>
  <div class="mode-welcome">
    <h2>选择工作模式</h2>
    <p>请选择要进入的管理模块</p>
  </div>
  <div class="mode-cards">
    <div class="mode-card" onclick="enterMode('ledger')">
      <div class="mode-card-icon ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <div class="mode-card-title">账单模式</div>
      <div class="mode-card-desc">客户单据、结账收款、打印结账单、导出Excel、回收站、云端同步</div>
      <div class="mode-card-badge">v4.0 已上线</div>
    </div>
    <div class="mode-card" onclick="enterMode('hr')">
      <div class="mode-card-icon hr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="mode-card-title">人事模式</div>
      <div class="mode-card-desc">员工档案、考勤请假、工资核算、请假分析图、打卡系统预留</div>
      <div class="mode-card-badge hr">v1.0 新上线</div>
    </div>
  </div>
</div>

<!-- 子系统容器 -->
<div id="appContainer">
  <div class="app-topbar">
    <button class="app-back-btn" onclick="backToMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      返回选择
    </button>
    <div class="app-title" id="appTitle">账单模式</div>
  </div>
  <iframe class="app-iframe" id="appIframe" src=""></iframe>
</div>

<script>
// 预设账号（与账本系统一致）
const VALID_ACCOUNTS = {
  'admin': '123456',
  'zhangsan': '123456',
  'lisi': '123456'
};
let currentUser = '';

// 检查登录状态
function checkLogin() {
  const saved = localStorage.getItem('dingju_app_login');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.account && VALID_ACCOUNTS[data.account]) {
        currentUser = data.account;
        showModePage();
        return;
      }
    } catch(e) {}
  }
  showLoginPage();
}

function showLoginPage() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('modePage').classList.remove('show');
  document.getElementById('appContainer').classList.remove('show');
}

function showModePage() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('modePage').classList.add('show');
  document.getElementById('appContainer').classList.remove('show');
  const displayNames = { 'admin': '管理员', 'zhangsan': '张三', 'lisi': '李四' };
  document.getElementById('currentUserDisplay').textContent = displayNames[currentUser] || currentUser;
}

function doLogin() {
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');

  if (!account || !password) {
    errorEl.textContent = '请输入账号和密码';
    return;
  }
  if (VALID_ACCOUNTS[account] && VALID_ACCOUNTS[account] === password) {
    currentUser = account;
    localStorage.setItem('dingju_app_login', JSON.stringify({ account: account, time: Date.now() }));
    errorEl.textContent = '';
    showModePage();
  } else {
    errorEl.textContent = '账号或密码错误';
  }
}

function doLogout() {
  localStorage.removeItem('dingju_app_login');
  currentUser = '';
  document.getElementById('loginAccount').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  showLoginPage();
}

function enterMode(mode) {
  const container = document.getElementById('appContainer');
  const iframe = document.getElementById('appIframe');
  const title = document.getElementById('appTitle');

  if (mode === 'ledger') {
    title.textContent = '账单模式';
    iframe.src = 'ledger.html';
  } else if (mode === 'hr') {
    title.textContent = '人事模式';
    iframe.src = 'hr.html';
  }

  document.getElementById('modePage').classList.remove('show');
  container.classList.add('show');
}

function backToMode() {
  const iframe = document.getElementById('appIframe');
  iframe.src = '';
  document.getElementById('appContainer').classList.remove('show');
  document.getElementById('modePage').classList.add('show');
}

// 回车登录
document.getElementById('loginPassword').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginAccount').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});

// 初始化
checkLogin();
</script>
</body>
</html>
